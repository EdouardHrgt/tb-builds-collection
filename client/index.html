<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sigmar's Arsenal — Vermintide 2 Modded Realm builds</title>
    <meta
      name="description"
      content="Share and discover Vermintide 2 Modded Realm builds based on the Tourney Balance mod: talents, weapons, gear and fast breakpoints for every career." />
    <meta name="color-scheme" content="dark" />
    <!-- Browser bar colour on phones, and the coloured stripe of the Discord embed -->
    <meta name="theme-color" content="#c9a24a" />
    <link rel="icon" href="/favicon.ico" sizes="any" />

    <!-- Link previews (Discord, Slack, Facebook...). They need ABSOLUTE addresses: the server replaces
         __APP_URL__ with the APP_URL of its .env when it serves this page (production only).
         The block between og:start and og:end is replaced by the server for the page of a build
         (server/src/meta.js): its title, career and author. -->
    <!-- og:start -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Sigmar's Arsenal" />
    <meta property="og:title" content="Sigmar's Arsenal — Vermintide 2 Modded Realm builds" />
    <meta
      property="og:description"
      content="Share and discover Vermintide 2 Modded Realm builds based on the Tourney Balance mod: talents, weapons, gear, breakpoints and more for every career." />
    <meta property="og:url" content="__APP_URL__/" />
    <meta property="og:image" content="__APP_URL__/shared/og-image.jpg" />
    <meta property="og:image:width" content="1424" />
    <meta property="og:image:height" content="752" />
    <meta
      property="og:image:alt"
      content="Sigmar's Arsenal: makers of fine weapons for the Empire" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- og:end -->
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
